name: Build and test IPA

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install project generator
        run: brew install xcodegen
      - name: Validate sources and dependencies
        run: python3 scripts/validate_project.py
      - name: Test shared production code
        run: swift test
      - name: Build iOS 17+ device application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -version | tee build/toolchain.txt
          xcodegen --version | tee -a build/toolchain.txt
          xcodegen generate
          xcodebuild -project Locus.xcodeproj -scheme Locus -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= build > build/xcodebuild.log 2>&1 || {
              tail -100 build/xcodebuild.log
              exit 1
            }
          # Record the native archive's deployment versions for compatibility review.
          xcrun otool -l Vendor/idevice/libidevice_ffi.a | awk '/minos / {print $2}' | sort -u > build/native-minimum-os.txt
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/Locus.app build/Payload/Locus.app
          cp LICENSE build/Payload/Locus.app/LICENSE-Locus.txt
          cp Vendor/idevice/LICENSE.txt build/Payload/Locus.app/LICENSE-idevice.txt
          cd build
          ditto -c -k --keepParent Payload Locus-CN-1.1.0-unsigned.ipa
          cd ..
          python3 scripts/verify_ipa.py build/Locus-CN-1.1.0-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Locus-CN-1.1.0-unsigned
          path: |
            build/*.ipa
            build/*.sha256
            build/ipa-report.json
            build/toolchain.txt
            build/native-minimum-os.txt
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/xcodebuild.log
            Locus.xcodeproj/project.pbxproj

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Locus-CN-1.1.0-unsigned
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title 'Locus 1.1.0 简体中文版' \
            --notes-file docs/RELEASE-1.1.0.md --verify-tag
