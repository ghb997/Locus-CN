name: Build and test IPA

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Install project generator
        run: brew install xcodegen
      - name: Validate sources and dependencies
        run: python3 scripts/validate_project.py
      - name: Test shared production code
        run: swift test
      - name: Cache native compilation
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/native-target
          key: ios17-native-xcode26.3-${{ runner.arch }}-${{ hashFiles('Vendor/idevice/source-lock.json', 'scripts/build_native.sh') }}
          restore-keys: |
            ios17-native-xcode26.3-${{ runner.arch }}-
            ios17-native-${{ runner.arch }}-
      - name: Rebuild native engine for iOS 17
        run: bash scripts/build_native.sh
      - name: Save native compilation cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/native-target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build iOS 17+ device application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -version | tee build/toolchain.txt
          xcodegen --version | tee -a build/toolchain.txt
          xcodegen generate
          xcodebuild -project Locus.xcodeproj -scheme Locus -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= LOCUS_SOURCE_REVISION="$GITHUB_SHA" build > build/xcodebuild.log 2>&1 || {
              tail -100 build/xcodebuild.log
              exit 1
            }
          # Record the native archive's deployment versions for compatibility review.
          xcrun otool -l Vendor/idevice/libidevice_ffi.a | awk '/minos / {print $2}' | sort -u > build/native-minimum-os.txt
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/Locus.app build/Payload/Locus.app
          cp LICENSE build/Payload/Locus.app/LICENSE-Locus.txt
          cp Vendor/idevice/LICENSE.txt build/Payload/Locus.app/LICENSE-idevice.txt
          cp build/THIRD-PARTY-LICENSES.txt build/Payload/Locus.app/THIRD-PARTY-LICENSES.txt
          cd build
          ditto -c -k --keepParent Payload Locus-CN-1.1.1-unsigned.ipa
          cd ..
          python3 scripts/verify_ipa.py build/Locus-CN-1.1.1-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Locus-CN-1.1.1-unsigned
          path: |
            build/*.ipa
            build/*.sha256
            build/ipa-report.json
            build/toolchain.txt
            build/native-minimum-os.txt
            build/native-build.json
            build/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
      - name: Upload native engine and generated headers
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-ios17
          path: |
            Vendor/idevice/libidevice_ffi.a
            Vendor/idevice/idevice.h
            build/native-build.json
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/xcodebuild.log
            Locus.xcodeproj/project.pbxproj

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Locus-CN-1.1.1-unsigned
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title 'Locus 1.1.1 简体中文增强版（原版 Bundle ID）' \
            --notes-file docs/RELEASE-1.1.1.md --verify-tag --prerelease
